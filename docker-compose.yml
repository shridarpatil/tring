services:
  freeswitch:
    image: safarov/freeswitch:latest
    container_name: tring-fs
    network_mode: host
    env_file:
      # Per-deployment trunk credentials (Exotel etc.). Gitignored; see
      # .env.example for the schema. Missing file is fine — defaults
      # keep the trunk inert.
      - path: .env
        required: false
    environment:
      - SOUND_RATES=8000:16000
      - SOUND_TYPES=music:en-us-callie
      # Public IP advertised in SDP and used for external RTP. Defaults
      # to STUN auto-detect for dev; on a VPS set TRING_PUBLIC_IP to the
      # real public IP in .env (one-way audio == this is wrong).
      - TRING_PUBLIC_IP=${TRING_PUBLIC_IP:-stun:stun.freeswitch.org}
      # RTP UDP port range. FS will allocate ONLY within [start, end]
      # — sized to match your VPS firewall rules. Each concurrent call
      # consumes 2 ports (RTP + RTCP).
      - TRING_RTP_START_PORT=${TRING_RTP_START_PORT:-16384}
      - TRING_RTP_END_PORT=${TRING_RTP_END_PORT:-32768}
      # Default the Exotel vars to safe values so vars.xml's env-set lines
      # don't leave FreeSWITCH variables empty (which would break the
      # gateway parse). Override via .env above.
      - EXOTEL_SIP_USERNAME=${EXOTEL_SIP_USERNAME:-}
      - EXOTEL_SIP_PASSWORD=${EXOTEL_SIP_PASSWORD:-}
      - EXOTEL_SIP_REALM=${EXOTEL_SIP_REALM:-placeholder.in.exotel.com}
      - EXOTEL_REGISTER=${EXOTEL_REGISTER:-false}
      - AIRTEL_SIP_USERNAME=${AIRTEL_SIP_USERNAME:-}
      - AIRTEL_SIP_PASSWORD=${AIRTEL_SIP_PASSWORD:-}
      - AIRTEL_SIP_REALM=${AIRTEL_SIP_REALM:-placeholder.airtel.com}
      - AIRTEL_REGISTER=${AIRTEL_REGISTER:-false}
      - JIO_SIP_USERNAME=${JIO_SIP_USERNAME:-}
      - JIO_SIP_PASSWORD=${JIO_SIP_PASSWORD:-}
      - JIO_SIP_REALM=${JIO_SIP_REALM:-placeholder.jio.com}
      - JIO_REGISTER=${JIO_REGISTER:-false}
      - TATA_SIP_USERNAME=${TATA_SIP_USERNAME:-}
      - TATA_SIP_PASSWORD=${TATA_SIP_PASSWORD:-}
      - TATA_SIP_REALM=${TATA_SIP_REALM:-placeholder.tatateleservices.com}
      - TATA_REGISTER=${TATA_REGISTER:-false}
    volumes:
      - freeswitch-sounds:/usr/share/freeswitch/sounds
      # All bind mounts use :ro because the safarov/freeswitch entrypoint
      # blindly copies vanilla templates over /etc/freeswitch/* on every
      # start. Read-only mounts make those copies silently fail and our
      # configs survive.
      - ./freeswitch/conf/vars.xml:/etc/freeswitch/vars.xml:ro
      - ./freeswitch/conf/dialplan/default.xml:/etc/freeswitch/dialplan/default.xml:ro
      - ./freeswitch/conf/directory/default.xml:/etc/freeswitch/directory/default.xml:ro
      - ./freeswitch/conf/autoload_configs/modules.conf.xml:/etc/freeswitch/autoload_configs/modules.conf.xml:ro
      - ./freeswitch/conf/autoload_configs/xml_curl.conf.xml:/etc/freeswitch/autoload_configs/xml_curl.conf.xml:ro
      # Overrides the default switch.conf.xml to wire the RTP port range
      # to vars.xml's $${rtp_start_port}/$${rtp_end_port} placeholders.
      - ./freeswitch/conf/autoload_configs/switch.conf.xml:/etc/freeswitch/autoload_configs/switch.conf.xml:ro
      - ./freeswitch/conf/sip_profiles/external/exotel.xml:/etc/freeswitch/sip_profiles/external/exotel.xml:ro
      - ./freeswitch/conf/sip_profiles/external/airtel.xml:/etc/freeswitch/sip_profiles/external/airtel.xml:ro
      - ./freeswitch/conf/sip_profiles/external/jio.xml:/etc/freeswitch/sip_profiles/external/jio.xml:ro
      - ./freeswitch/conf/sip_profiles/external/tata.xml:/etc/freeswitch/sip_profiles/external/tata.xml:ro
    # network_mode: host is simplest for SIP/RTP during dev.
    # Ports: 5060 (SIP), 5080 (external SIP), 8021 (ESL),
    #        7443 (WSS for WebRTC), 16384-32768 (RTP).
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: tring-db
    environment:
      POSTGRES_USER: tring
      POSTGRES_PASSWORD: tring_dev
      POSTGRES_DB: tring
    ports:
      - "5434:5432"
    volumes:
      - tring-db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tring -d tring"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- Tring Go services ------------------------------------------------
  # Both are built from the same Dockerfile via build args (CMD=api or
  # CMD=orchestrator). Distroless final image, statically linked binary,
  # ~15 MB. Use host networking so they can speak to FreeSWITCH on the
  # standard 127.0.0.1:8021 ESL port and the host-mapped Postgres on :5434
  # without bridge-DNS gymnastics.
  #
  # For dev hot-reload, stop the relevant container and `go run` it on the
  # host instead:  `docker compose stop api && go run ./cmd/api`.

  api:
    build:
      context: .
      args:
        CMD: api
    image: tring-api:local
    container_name: tring-api
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - TRING_DSN=${TRING_DSN:-postgres://tring:tring_dev@127.0.0.1:5434/tring}
      - TRING_JWT_SECRET=${TRING_JWT_SECRET:-tring_dev_jwt_secret_change_me_in_prod}
      - TRING_FS_BASIC_AUTH=${TRING_FS_BASIC_AUTH:-fs:fs_dev_secret_change_me_in_prod}
      # Empty TRING_WS_URL → API auto-detects the host's outbound IP and
      # uses ws://<that>:5066 (FreeSWITCH's plain-WS binding). Override
      # with wss://voice.yourdomain:7443 once you front FS with TLS.
      - TRING_WS_URL=${TRING_WS_URL:-}
      - TRING_ESL_ADDR=${TRING_ESL_ADDR:-127.0.0.1:8021}
      - TRING_ESL_PASSWORD=${TRING_ESL_PASSWORD:-ClueCon}
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      args:
        CMD: orchestrator
    image: tring-orchestrator:local
    container_name: tring-orchestrator
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - TRING_DSN=${TRING_DSN:-postgres://tring:tring_dev@127.0.0.1:5434/tring}
      - TRING_ESL_ADDR=${TRING_ESL_ADDR:-127.0.0.1:8021}
      - TRING_ESL_PASSWORD=${TRING_ESL_PASSWORD:-ClueCon}
    restart: unless-stopped

volumes:
  freeswitch-sounds:
  tring-db-data:
