services:
  freeswitch:
    image: safarov/freeswitch:latest
    container_name: tring-fs
    network_mode: host
    # FreeSWITCH wants real-time thread priority for low-latency audio.
    # Without SYS_NICE it logs "Failed to set SCHED_FIFO / Could not set nice
    # level" and runs at normal priority — fine in dev, but media threads can
    # jitter under CPU load. Grant the capability + allow the rtprio it asks for.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 95
    # Start after the API container so FreeSWITCH's first mod_xml_curl lookups
    # (directory/gateways/ACL against :8085 on boot) are less likely to race a
    # not-yet-listening API. service_started (not _healthy) because the API is a
    # distroless image with no shell/curl for a healthcheck — this is ordering
    # only, so a brief first-query race can still occur, but FS retries on real
    # lookups so it self-heals.
    depends_on:
      api:
        condition: service_started
    env_file:
      # Per-deployment trunk credentials (Exotel etc.). Gitignored; see
      # .env.example for the schema. Missing file is fine — defaults
      # keep the trunk inert.
      - path: .env
        required: false
    # All TRING_* config comes from .env (env_file above) — see .env.example.
    # FreeSWITCH reads TRING_PUBLIC_IP / TRING_INTERNAL_IP / TRING_RTP_* via
    # vars.xml's exec-set lines. Only image-specific vars stay inline here.
    environment:
      - SOUND_RATES=8000:16000
      - SOUND_TYPES=music:en-us-callie
    volumes:
      - freeswitch-sounds:/usr/share/freeswitch/sounds
      # Our config overrides are mounted onto the entrypoint's COPY SOURCE
      # (/usr/share/freeswitch/conf/vanilla/*), NOT the destination
      # (/etc/freeswitch/*). On boot the safarov entrypoint runs
      # `cp vanilla/* /etc/freeswitch/`; by overriding the source, the copy
      # picks up OUR files into a fresh writable /etc/freeswitch — our configs
      # still win, and there are no "Read-only file system" cp errors (the old
      # approach mounted :ro onto the destination, so every copy collided).
      # :ro is safe here because the entrypoint only READS the source.
      - ./freeswitch/conf/vars.xml:/usr/share/freeswitch/conf/vanilla/vars.xml:ro
      - ./freeswitch/conf/dialplan/default.xml:/usr/share/freeswitch/conf/vanilla/dialplan/default.xml:ro
      - ./freeswitch/conf/directory/default.xml:/usr/share/freeswitch/conf/vanilla/directory/default.xml:ro
      - ./freeswitch/conf/autoload_configs/modules.conf.xml:/usr/share/freeswitch/conf/vanilla/autoload_configs/modules.conf.xml:ro
      - ./freeswitch/conf/autoload_configs/xml_curl.conf.xml:/usr/share/freeswitch/conf/vanilla/autoload_configs/xml_curl.conf.xml:ro
      # Overrides the default switch.conf.xml to wire the RTP port range
      # to vars.xml's $${rtp_start_port}/$${rtp_end_port} placeholders.
      - ./freeswitch/conf/autoload_configs/switch.conf.xml:/usr/share/freeswitch/conf/vanilla/autoload_configs/switch.conf.xml:ro
      # (Static Exotel/Airtel/Jio/Tata gateway XML mounts removed.
      # Trunks now live in DB and render to external/dynamic/ at runtime.)
      # Custom external sofia profile — adds external/dynamic/*.xml to
      # the gateway include list so UI-managed trunks are picked up on
      # `sofia profile external rescan`.
      - ./freeswitch/conf/sip_profiles/external.xml:/usr/share/freeswitch/conf/vanilla/sip_profiles/external.xml:ro
      # Static gateway pointing at the Tring media gateway (agent_transport=
      # gateway; ADR-001 M4b). Picked up by external.xml's external/*.xml
      # include.
      - ./freeswitch/conf/sip_profiles/external/tring-gw.xml:/usr/share/freeswitch/conf/vanilla/sip_profiles/external/tring-gw.xml:ro
      # Override sofia's internal profile to disable the force-register-*
      # params — see comment block in the file for why (multi-tenant
      # depends on the SDK's From URI domain reaching /fs/directory
      # un-rewritten).
      - ./freeswitch/conf/sip_profiles/internal.xml:/usr/share/freeswitch/conf/vanilla/sip_profiles/internal.xml:ro
      # Dynamic gateway dir — Tring writes t_<uuid>.xml here, FS reads. This
      # stays mounted at the DESTINATION (not vanilla source) and RW because
      # the api container shares the SAME host path at the same /etc path; the
      # entrypoint copy just lands vanilla's external/* alongside it.
      - ./freeswitch/conf/sip_profiles/external/dynamic:/etc/freeswitch/sip_profiles/external/dynamic:rw
    # network_mode: host is simplest for SIP/RTP during dev.
    # Ports: 5060 (SIP), 5080 (external SIP), 8021 (ESL),
    #        7443 (WSS for WebRTC), 16384-32768 (RTP).
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: tring-db
    environment:
      POSTGRES_USER: tring
      POSTGRES_PASSWORD: tring_dev
      POSTGRES_DB: tring
    ports:
      - "5434:5432"
    volumes:
      - tring-db-data:/var/lib/postgresql/data
      # Schema is owned by the embedded golang-migrate (see
      # internal/migrate/migrations/). The api applies migrations on
      # startup against an empty DB. For dev seed data (predictable
      # tenant + API key), run after first up:
      #
      #   docker exec -i tring-db psql -U tring -d tring < db/seed.sql
      #
      # For prod: docker compose run --rm api --seed-tenant "Your Org"
      # to generate a fresh API key.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tring -d tring"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tring-redis
    # Pure cache — no persistence. The IVR flow cache is repopulated from
    # Postgres on a miss, so losing it on restart only costs a few DB reads.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- Tring Go services ------------------------------------------------
  # Both are built from the same Dockerfile via build args (CMD=api or
  # CMD=orchestrator). Distroless final image, statically linked binary,
  # ~15 MB. Use host networking so they can speak to FreeSWITCH on the
  # standard 127.0.0.1:8021 ESL port and the host-mapped Postgres on :5434
  # without bridge-DNS gymnastics.
  #
  # For dev hot-reload, stop the relevant container and `go run` it on the
  # host instead:  `docker compose stop api && go run ./cmd/api`.

  api:
    # Pulls the published image by default. CI/CD pushes :develop on every
    # main push and a versioned tag (:v0.1.0) on each release. Pin via
    # `TRING_TAG=v0.1.0` in .env. Local source-tree dev: bypass with
    # `docker compose up -d --build api`.
    image: ghcr.io/shridarpatil/tring-api:${TRING_TAG:-develop}
    build:
      context: .
      args:
        CMD: api
    container_name: tring-api
    network_mode: host
    # Run as the typical host UID so the bind-mounted gateway dir
    # below is writable from inside the distroless container (the
    # default `nonroot` UID 65532 would clash with a host dir owned
    # by 1000). Override TRING_API_UID/GID for other host users.
    user: "${TRING_API_UID:-1000}:${TRING_API_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # All config comes from .env — see .env.example. Anything absent falls back
    # to the binary's built-in koanf default (internal/config).
    env_file:
      - path: .env
        required: false
    volumes:
      # Shared with the freeswitch container — Tring writes UI-managed
      # trunk XMLs (t_<uuid>.xml) here, FS reads them on profile rescan.
      # Same host path mounted at the same container path so the Go code
      # can write to /etc/freeswitch/... by default.
      - ./freeswitch/conf/sip_profiles/external/dynamic:/etc/freeswitch/sip_profiles/external/dynamic:rw
    restart: unless-stopped

  orchestrator:
    image: ghcr.io/shridarpatil/tring-orchestrator:${TRING_TAG:-develop}
    build:
      context: .
      args:
        CMD: orchestrator
    container_name: tring-orchestrator
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # All config from .env — see .env.example.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  # WebRTC media gateway (ADR-001). Browsers peer with this over raw WebRTC
  # (HTTPS signaling on :8087); it bridges media into the PRIVATE FreeSWITCH —
  # browsers never touch SIP or FS directly. host networking so the UDP RTP
  # range + SIP UAS exchange media with FS and browsers without NAT hairpinning
  # (same reason FS uses it).
  gateway:
    image: ghcr.io/shridarpatil/tring-gateway:${TRING_TAG:-develop}
    build:
      context: .
      args:
        CMD: gateway
    container_name: tring-gateway
    network_mode: host
    depends_on:
      freeswitch:
        condition: service_started
    # All config from .env — see .env.example (TRING_GATEWAY_*, TRING_FS_*,
    # TRING_PUBLIC_IP, TURN, JWT secret shared with the api, …).
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  # Local SIP trunk simulator — stands in for the Tata SBC during dev.
  # Listens on UDP/5070 as a SIPp UAS; answers every INVITE 200 OK so
  # the full Tring → trunk signaling path can be exercised before the
  # real circuit lands. See sim/README.md for the integration recipe.
  # Opt-in: not required for the dev stack — `docker compose up -d
  # sip-sim` brings it up alongside, or include it in regular `up`.
  sip-sim:
    # Dev-only SIP simulator. Doesn't start on a plain `docker compose up`;
    # bring it up explicitly with `docker compose --profile dev up -d`.
    profiles: ["dev"]
    image: tring-sip-sim:${TRING_TAG:-develop}
    build:
      context: ./sim
    container_name: tring-sip-sim
    network_mode: host
    restart: unless-stopped

volumes:
  freeswitch-sounds:
  tring-db-data:
