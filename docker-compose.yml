services:
  freeswitch:
    # Baked image: FROM safarov/freeswitch + Tring's STATIC config (see
    # freeswitch/Dockerfile). Built here so dev runs the EXACT image shipped to
    # production. Trade-off: editing freeswitch/conf now needs a rebuild
    # (`make images` or `docker compose build freeswitch`) + recreate, not just
    # a restart. Only the dynamic trunk dir + FS built-in sounds stay as volumes.
    image: shridh0r/tring-freeswitch:${TRING_TAG:-develop}
    build:
      context: ./freeswitch
      dockerfile: Dockerfile
    container_name: tring-fs
    network_mode: host
    # FreeSWITCH wants real-time thread priority for low-latency audio.
    # Without SYS_NICE it logs "Failed to set SCHED_FIFO / Could not set nice
    # level" and runs at normal priority — fine in dev, but media threads can
    # jitter under CPU load. Grant the capability + allow the rtprio it asks for.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 95
      # Each call holds several sockets (carrier + fsplug RTP/RTCP); the
      # default soft limit of 1024 rejects calls with 488 past ~120.
      nofile: 65536
    # Start after the tring container so FreeSWITCH's first mod_xml_curl lookups
    # (directory/gateways/ACL against the api role on boot) are less likely to
    # race a not-yet-listening api. service_started (not _healthy) because tring
    # is a distroless image with no shell/curl for a healthcheck — this is ordering
    # only, so a brief first-query race can still occur, but FS retries on real
    # lookups so it self-heals.
    depends_on:
      tring:
        condition: service_started
    env_file:
      # Per-deployment trunk credentials. Gitignored; see
      # .env.example for the schema. Missing file is fine — defaults
      # keep the trunk inert.
      - path: .env
        required: false
    # All TRING_* config comes from .env (env_file above) — see .env.example.
    # FreeSWITCH reads TRING_PUBLIC_IP / TRING_INTERNAL_IP / TRING_RTP_* via
    # vars.xml's exec-set lines. Only image-specific vars stay inline here.
    environment:
      - SOUND_RATES=8000:16000
      - SOUND_TYPES=music:en-us-callie
    volumes:
      - freeswitch-sounds:/usr/share/freeswitch/sounds
      # No tenant-sound or recording mounts: FreeSWITCH no longer plays IVR
      # prompts or records calls — the gateway (pion plane + internal/callcdr)
      # owns both. FS is the PSTN trunk edge only.
      # Dynamic trunk gateways — RUNTIME only (NOT baked into the image): Tring
      # writes t_<uuid>.xml here and rescans the external profile; the api shares
      # the same host path. Static config is baked into the image above.
      # Read-only here: only the api writes trunk gateways. FreeSWITCH loads
      # (and preprocesses) every file in it, so FS must never be the writer.
      - ./freeswitch/conf/sip_profiles/external/dynamic:/etc/freeswitch/sip_profiles/external/dynamic:ro
      # WhatsApp SIP TLS certs (agent.pem, cafile.pem) — host-managed so they
      # can be renewed without a rebuild. Unused unless TRING_WHATSAPP_ENABLED.
      - ./freeswitch/tls/whatsapp:/etc/freeswitch/tls/whatsapp:ro
    # network_mode: host is simplest for SIP/RTP during dev.
    # Ports: 5060 (SIP), 5080 (external SIP), 8021 (ESL),
    #        7443 (WSS for WebRTC), 16384-32768 (RTP).
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: tring-db
    environment:
      POSTGRES_USER: tring
      POSTGRES_PASSWORD: tring_dev
      POSTGRES_DB: tring
      TZ: ${TZ:-Asia/Kolkata}
    # Loopback only: tring uses host networking and reach it on
    # 127.0.0.1. A bare "5434:5432" publishes on 0.0.0.0 and Docker's iptables
    # rules bypass ufw/firewalld, exposing the DB to the network.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - tring-db-data:/var/lib/postgresql/data
      # Schema is owned by the embedded golang-migrate (see
      # internal/migrate/migrations/). The api applies migrations on
      # startup against an empty DB. For dev seed data (predictable
      # tenant + API key), run after first up:
      #
      #   docker exec -i tring-db psql -U tring -d tring < db/seed.sql
      #
      # For prod: docker compose run --rm tring --seed-tenant "Your Org"
      # to generate a fresh API key.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tring -d tring"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tring-redis
    # Pure cache — no persistence. The IVR flow cache is repopulated from
    # Postgres on a miss, so losing it on restart only costs a few DB reads.
    #
    # Auth: when TRING_REDIS_PASSWORD is set (in .env — `make up`/install.sh
    # generate one), Redis requires it (requirepass) and tring sends
    # it. Empty = no auth (pre-existing deployments keep working). The password
    # is fed to redis-server as a config file on stdin rather than as an argv
    # flag so it doesn't show up in `ps` on the host. `$$` defers expansion to
    # the container shell; docker-entrypoint.sh still drops to the redis user.
    command:
      - sh
      - -c
      - |
        if [ -n "$$TRING_REDIS_PASSWORD" ]; then
        exec docker-entrypoint.sh redis-server - --save '' --appendonly no <<EOF
        requirepass "$$TRING_REDIS_PASSWORD"
        EOF
        fi
        exec docker-entrypoint.sh redis-server --save '' --appendonly no
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      TRING_REDIS_PASSWORD: ${TRING_REDIS_PASSWORD:-}
    # Loopback only — see the postgres ports note. Set TRING_REDIS_PASSWORD too
    # (defence in depth: any local process can otherwise reach 127.0.0.1:6379).
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # REDISCLI_AUTH can't be used: an empty value makes redis-cli send a
      # bare AUTH, which fails on a password-less server. Grep for PONG since
      # redis-cli exits 0 even on a NOAUTH error reply.
      test: ["CMD-SHELL", "if [ -n \"$$TRING_REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$TRING_REDIS_PASSWORD\"; fi; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- Tring ------------------------------------------------------------
  # One binary, one container: the api role (REST, console, /fs callbacks,
  # migrations) and the gateway role (pion SFU + brain on /rtc, fsplug). Host
  # networking so it can speak to FreeSWITCH on the standard 127.0.0.1:8021 ESL
  # port and the host-mapped Postgres on :5434 without bridge-DNS gymnastics,
  # and so the UDP media range exchanges media with browsers without NAT
  # hairpinning.
  #
  # For dev hot-reload, stop the container and `go run` it on the host
  # instead:  `docker compose stop tring && make run`.
  tring:
    # Pulls the published image by default. CI/CD pushes :develop on every
    # main push and a versioned tag (:v0.1.0) on each release. Pin via
    # `TRING_TAG=v0.1.0` in .env. Local source-tree dev: bypass with
    # `docker compose up -d --build tring`.
    image: shridh0r/tring:${TRING_TAG:-develop}
    build:
      context: .
    container_name: tring
    network_mode: host
    # Run as the typical host UID so the bind-mounted dirs below (trunk XMLs,
    # sounds, recordings spool) are writable from inside the distroless
    # container (the default `nonroot` UID 65532 would clash with host dirs
    # owned by 1000). Override TRING_API_UID/GID for other host users.
    user: "${TRING_API_UID:-1000}:${TRING_API_GID:-1000}"
    # docker stop waits this long before SIGKILL. On SIGTERM the gateway role
    # stops taking new calls and lets live ones finish for up to
    # TRING_GATEWAY_DRAIN_SECONDS (default 300); keep this above it.
    stop_grace_period: 330s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # All config comes from .env — see .env.example. Anything absent falls back
    # to the binary's built-in koanf default (internal/config).
    env_file:
      - path: .env
        required: false
    volumes:
      # Shared with the freeswitch container — Tring writes UI-managed
      # trunk XMLs (t_<uuid>.xml) here, FS reads them on profile rescan.
      # Same host path mounted at the same container path so the Go code
      # can write to /etc/freeswitch/... by default.
      - ./freeswitch/conf/sip_profiles/external/dynamic:/etc/freeswitch/sip_profiles/external/dynamic:rw
      # Tenant sound library — the api role writes uploaded audio + synthesized
      # TTS here; the gateway role plays it on the media plane (audio_dir).
      - ./freeswitch/sounds:/var/lib/tring/sounds:rw
      # Call recordings — the gateway role records media-plane calls (web +
      # phone plug) into this spool and the api role serves them (and uploads
      # to S3 when set). A host bind-mount owned by the host user, NOT a
      # root-owned volume — FreeSWITCH no longer writes recordings.
      - ./recordings:/var/lib/tring/recordings
    restart: unless-stopped

  # Local SIP trunk simulator — stands in for the Tata SBC during dev.
  # Listens on UDP/5070 as a SIPp UAS; answers every INVITE 200 OK so
  # the full Tring → trunk signaling path can be exercised before the
  # real circuit lands. See sim/README.md for the integration recipe.
  # Opt-in: not required for the dev stack — `docker compose up -d
  # sip-sim` brings it up alongside, or include it in regular `up`.
  sip-sim:
    # Dev-only SIP simulator. Doesn't start on a plain `docker compose up`;
    # bring it up explicitly with `docker compose --profile dev up -d`.
    profiles: ["dev"]
    image: tring-sip-sim:${TRING_TAG:-develop}
    build:
      context: ./sim
    container_name: tring-sip-sim
    network_mode: host
    restart: unless-stopped

volumes:
  freeswitch-sounds:
  tring-db-data:
