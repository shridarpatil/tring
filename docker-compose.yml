services:
  freeswitch:
    image: safarov/freeswitch:latest
    container_name: tring-fs
    network_mode: host
    env_file:
      # Per-deployment trunk credentials (Exotel etc.). Gitignored; see
      # .env.example for the schema. Missing file is fine — defaults
      # keep the trunk inert.
      - path: .env
        required: false
    environment:
      - SOUND_RATES=8000:16000
      - SOUND_TYPES=music:en-us-callie
      # Public IP advertised in SDP / used for external RTP. Empty by
      # default → FreeSWITCH advertises its LAN IP (correct for dev, binds
      # cleanly). On a VPS set TRING_PUBLIC_IP to the real public IP in
      # .env (mismatch == one-way audio).
      - TRING_PUBLIC_IP=${TRING_PUBLIC_IP:-}
      # RTP UDP port range. FS will allocate ONLY within [start, end]
      # — sized to match your VPS firewall rules. Each concurrent call
      # consumes 2 ports (RTP + RTCP).
      - TRING_RTP_START_PORT=${TRING_RTP_START_PORT:-16384}
      - TRING_RTP_END_PORT=${TRING_RTP_END_PORT:-32768}
      # Trunk credentials (Exotel/Airtel/Jio/Tata, including IP-auth for
      # the Tata private circuit) are managed via the admin console at
      # /trunks — see internal/api/handlers_trunks.go. No trunk env vars
      # are needed; FS picks up gateways from external/dynamic/t_*.xml,
      # rendered by the api service on every trunk save + sofia rescan.
    volumes:
      - freeswitch-sounds:/usr/share/freeswitch/sounds
      # All bind mounts use :ro because the safarov/freeswitch entrypoint
      # blindly copies vanilla templates over /etc/freeswitch/* on every
      # start. Read-only mounts make those copies silently fail and our
      # configs survive.
      - ./freeswitch/conf/vars.xml:/etc/freeswitch/vars.xml:ro
      - ./freeswitch/conf/dialplan/default.xml:/etc/freeswitch/dialplan/default.xml:ro
      - ./freeswitch/conf/directory/default.xml:/etc/freeswitch/directory/default.xml:ro
      - ./freeswitch/conf/autoload_configs/modules.conf.xml:/etc/freeswitch/autoload_configs/modules.conf.xml:ro
      - ./freeswitch/conf/autoload_configs/xml_curl.conf.xml:/etc/freeswitch/autoload_configs/xml_curl.conf.xml:ro
      # Overrides the default switch.conf.xml to wire the RTP port range
      # to vars.xml's $${rtp_start_port}/$${rtp_end_port} placeholders.
      - ./freeswitch/conf/autoload_configs/switch.conf.xml:/etc/freeswitch/autoload_configs/switch.conf.xml:ro
      # (Static Exotel/Airtel/Jio/Tata gateway XML mounts removed.
      # Trunks now live in DB and render to external/dynamic/ at runtime.)
      # Custom external sofia profile — adds external/dynamic/*.xml to
      # the gateway include list so UI-managed trunks are picked up on
      # `sofia profile external rescan`.
      - ./freeswitch/conf/sip_profiles/external.xml:/etc/freeswitch/sip_profiles/external.xml:ro
      # Dynamic gateway dir — Tring writes t_<uuid>.xml here, FS reads.
      # RW because both containers share this host path.
      - ./freeswitch/conf/sip_profiles/external/dynamic:/etc/freeswitch/sip_profiles/external/dynamic:rw
    # network_mode: host is simplest for SIP/RTP during dev.
    # Ports: 5060 (SIP), 5080 (external SIP), 8021 (ESL),
    #        7443 (WSS for WebRTC), 16384-32768 (RTP).
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: tring-db
    environment:
      POSTGRES_USER: tring
      POSTGRES_PASSWORD: tring_dev
      POSTGRES_DB: tring
    ports:
      - "5434:5432"
    volumes:
      - tring-db-data:/var/lib/postgresql/data
      # Schema is owned by the embedded golang-migrate (see
      # internal/migrate/migrations/). The api applies migrations on
      # startup against an empty DB. For dev seed data (predictable
      # tenant + API key), run after first up:
      #
      #   docker exec -i tring-db psql -U tring -d tring < db/seed.sql
      #
      # For prod: docker compose run --rm api --seed-tenant "Your Org"
      # to generate a fresh API key.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tring -d tring"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- Tring Go services ------------------------------------------------
  # Both are built from the same Dockerfile via build args (CMD=api or
  # CMD=orchestrator). Distroless final image, statically linked binary,
  # ~15 MB. Use host networking so they can speak to FreeSWITCH on the
  # standard 127.0.0.1:8021 ESL port and the host-mapped Postgres on :5434
  # without bridge-DNS gymnastics.
  #
  # For dev hot-reload, stop the relevant container and `go run` it on the
  # host instead:  `docker compose stop api && go run ./cmd/api`.

  api:
    # Pulls the published image by default. CI/CD pushes :develop on every
    # main push and a versioned tag (:v0.1.0) on each release. Pin via
    # `TRING_TAG=v0.1.0` in .env. Local source-tree dev: bypass with
    # `docker compose up -d --build api`.
    image: ghcr.io/shridarpatil/tring-api:${TRING_TAG:-develop}
    build:
      context: .
      args:
        CMD: api
    container_name: tring-api
    network_mode: host
    # Run as the typical host UID so the bind-mounted gateway dir
    # below is writable from inside the distroless container (the
    # default `nonroot` UID 65532 would clash with a host dir owned
    # by 1000). Override TRING_API_UID/GID for other host users.
    user: "${TRING_API_UID:-1000}:${TRING_API_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - TRING_DSN=${TRING_DSN:-postgres://tring:tring_dev@127.0.0.1:5434/tring}
      - TRING_JWT_SECRET=${TRING_JWT_SECRET:-tring_dev_jwt_secret_change_me_in_prod}
      - TRING_FS_BASIC_AUTH=${TRING_FS_BASIC_AUTH:-fs:fs_dev_secret_change_me_in_prod}
      # Empty TRING_WS_URL → API auto-detects the host's outbound IP and
      # uses ws://<that>:5066 (FreeSWITCH's plain-WS binding). Override
      # with wss://voice.yourdomain:7443 once you front FS with TLS.
      - TRING_WS_URL=${TRING_WS_URL:-}
      - TRING_ESL_ADDR=${TRING_ESL_ADDR:-127.0.0.1:8021}
      - TRING_ESL_PASSWORD=${TRING_ESL_PASSWORD:-ClueCon}
      # WebRTC ICE servers, returned by /v1/sdk/credentials. STUN
      # default is Google's public server; replace with a self-hosted
      # STUN if you don't want browsers calling out to Google. TURN is
      # opt-in — without it, browsers behind symmetric NAT can't
      # establish media.
      - TRING_STUN_URL=${TRING_STUN_URL:-stun:stun.l.google.com:19302}
      - TRING_TURN_URL=${TRING_TURN_URL:-}
      - TRING_TURN_USERNAME=${TRING_TURN_USERNAME:-}
      - TRING_TURN_PASSWORD=${TRING_TURN_PASSWORD:-}
    volumes:
      # Shared with the freeswitch container — Tring writes UI-managed
      # trunk XMLs (t_<uuid>.xml) here, FS reads them on profile rescan.
      # Same host path mounted at the same container path so the Go code
      # can write to /etc/freeswitch/... by default.
      - ./freeswitch/conf/sip_profiles/external/dynamic:/etc/freeswitch/sip_profiles/external/dynamic:rw
    restart: unless-stopped

  orchestrator:
    image: ghcr.io/shridarpatil/tring-orchestrator:${TRING_TAG:-develop}
    build:
      context: .
      args:
        CMD: orchestrator
    container_name: tring-orchestrator
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - TRING_DSN=${TRING_DSN:-postgres://tring:tring_dev@127.0.0.1:5434/tring}
      - TRING_ESL_ADDR=${TRING_ESL_ADDR:-127.0.0.1:8021}
      - TRING_ESL_PASSWORD=${TRING_ESL_PASSWORD:-ClueCon}
    restart: unless-stopped

  # Local SIP trunk simulator — stands in for the Tata SBC during dev.
  # Listens on UDP/5070 as a SIPp UAS; answers every INVITE 200 OK so
  # the full Tring → trunk signaling path can be exercised before the
  # real circuit lands. See sim/README.md for the integration recipe.
  # Opt-in: not required for the dev stack — `docker compose up -d
  # sip-sim` brings it up alongside, or include it in regular `up`.
  sip-sim:
    # Dev-only SIP simulator. Doesn't start on a plain `docker compose up`;
    # bring it up explicitly with `docker compose --profile dev up -d`.
    profiles: ["dev"]
    build:
      context: ./sim
    image: tring-sip-sim:local
    container_name: tring-sip-sim
    network_mode: host
    restart: unless-stopped

volumes:
  freeswitch-sounds:
  tring-db-data:
