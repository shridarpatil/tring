# GoReleaser v2 config for Tring tag releases.
#
# Triggered by .github/workflows/release.yml on tag pushes (v*). Builds
# both Go binaries for linux/darwin × amd64/arm64, ships them in tar.gz
# archives, builds Docker images per (binary, arch), assembles multi-arch
# manifests, pushes to GHCR + Docker Hub, and creates a GitHub Release
# with the auto-generated changelog.
#
# Env vars expected from the workflow:
#   GITHUB_TOKEN  - built-in; for the GitHub Release + GHCR pushes
#   DOCKER_ORG    - Docker Hub user/org (typically your DOCKERHUB_USERNAME)
#   GITHUB_ORG    - GitHub user/org (== github.repository_owner)

version: 2

project_name: tring

before:
  hooks:
    - go mod tidy

builds:
  - id: api
    main: ./cmd/api
    binary: tring-api
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}

  - id: orchestrator
    main: ./cmd/orchestrator
    binary: tring-orchestrator
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}

  - id: gateway
    main: ./cmd/gateway
    binary: tring-gateway
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}

archives:
  - id: api
    ids: [api]
    name_template: "tring-api_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, NOTICE, README.md]
  - id: orchestrator
    ids: [orchestrator]
    name_template: "tring-orchestrator_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, NOTICE, README.md]
  - id: gateway
    ids: [gateway]
    name_template: "tring-gateway_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, NOTICE, README.md]

changelog:
  sort: asc
  filters:
    exclude: [^docs:, ^test:, ^ci:, ^chore:]

release:
  name_template: "Tring {{ .Tag }}"
  draft: false
  prerelease: auto
