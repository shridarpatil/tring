name: Build images

# Builds and pushes all four Tring images to GHCR:
#   ghcr.io/<owner>/tring-{api,orchestrator,gateway,freeswitch}
#
# - push to main  → tag `develop` (matches docker-compose's TRING_TAG default)
# - push a v* tag → tags `X.Y.Z` and `X.Y`  (set meta.tring_version in Nomad to X.Y.Z)
#
# The three Go images share the root Dockerfile (--build-arg CMD=<binary>);
# freeswitch is a small FROM safarov/freeswitch + baked static config.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
            build-args: CMD=api
          - name: orchestrator
            context: .
            dockerfile: Dockerfile
            build-args: CMD=orchestrator
          - name: gateway
            context: .
            dockerfile: Dockerfile
            build-args: CMD=gateway
          - name: freeswitch
            context: freeswitch
            dockerfile: freeswitch/Dockerfile
            build-args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Push every image to BOTH registries (GHCR + Docker Hub). Docker Hub
          # repos can be public even while the source repo stays private, so a
          # server can pull without a GHCR token.
          images: |
            ghcr.io/${{ github.repository_owner }}/tring-${{ matrix.name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tring-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=develop,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
