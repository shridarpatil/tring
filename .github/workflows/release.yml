name: FreeSWITCH image

# Builds and pushes ONLY the tring-freeswitch image to GHCR + Docker Hub:
#   - push to main   → tag `develop`
#   - push a git tag → tag = the tag name (e.g. v0.1.0)
#
# The three Go images follow the SAME convention but are built elsewhere:
# test.yml's `build-develop` pushes :develop on main, and GoReleaser pushes
# :<tag> on a git tag (both registries, multi-arch). FreeSWITCH is a non-Go
# image GoReleaser can't build, so it lives here — same tags, same registries.

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: freeswitch-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeswitch:
    name: tring-freeswitch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/tring-freeswitch
            ${{ secrets.DOCKERHUB_USERNAME }}/tring-freeswitch
          # main -> develop ; git tag vX.Y.Z -> vX.Y.Z (the tag name verbatim)
          tags: |
            type=raw,value=develop,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: freeswitch
          file: freeswitch/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=freeswitch
          cache-to: type=gha,mode=max,scope=freeswitch
