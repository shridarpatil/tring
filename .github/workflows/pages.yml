name: docs site

# Builds docs/ with oatdocs (a small Go docs generator, no npm) and
# publishes it to GitHub Pages. The oatdocs version is pinned; Go's checksum
# database verifies its source.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    # oat-theme.css: the docs take the console's theme variables from it.
    paths: ["docs/**", "web/src/oat-theme.css", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: actions/configure-pages@v6
      - name: Build
        run: go run github.com/shridarpatil/oatdocs@v0.2.0 build docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
