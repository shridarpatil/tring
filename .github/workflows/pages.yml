name: docs site

# Builds docs/ (Astro Starlight, same setup as the whatomate docs) and
# publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/configure-pages@v6
      # Exact versions from the lockfile; no install scripts run.
      - name: Install
        working-directory: docs
        run: npm ci --ignore-scripts
      - name: Audit
        working-directory: docs
        # Fail on any high/critical advisory except those listed in IGNORE.
        # GHSA-fc5q-39xc-vjpf: picomatch ReDoS, no patched release yet (all
        # <= 4.0.7). Build-time only, on our own globs; the site is static.
        # Remove it once picomatch ships a fix.
        env:
          IGNORE: GHSA-fc5q-39xc-vjpf
        run: |
          npm audit --omit=dev --json > audit.json || true
          found=$(jq -r '[.vulnerabilities[].via[] | objects
            | select(.severity == "high" or .severity == "critical") | .url]
            | unique | .[]' audit.json | grep -vE "$(echo "$IGNORE" | tr ' ' '|')" || true)
          if [ -n "$found" ]; then
            npm audit --omit=dev --audit-level=high || true
            echo "::error::unignored high/critical advisories: $found"
            exit 1
          fi
      - name: Build
        working-directory: docs
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
