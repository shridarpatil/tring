name: CI

# Full CI pipeline: test → build/push images → release. Image and release jobs
# all `needs: [unit, integration]`, so nothing ships unless the tests are green.
#
# Test stage: the fast `unit` job runs on every push + PR and covers everything
# that doesn't need FreeSWITCH: pure-function tests, JWT, masking, webhook
# signing, plus DB-backed handler/trunks tests against a Postgres service
# container. The slower `integration` job boots the full docker-compose stack
# and runs the FreeSWITCH-tagged tests against a real ESL endpoint, after checking
# the FreeSWITCH image boots with a worst-case random password. It runs on main,
# manual dispatch and PRs from this repo (not forks).
#
# Build/release stage (gated on the tests, push events only):
#   - images : three images -> :develop on main, :<tag> on a v* tag, to
#              GHCR + Docker Hub.
#   - release: GoReleaser on a v* tag -> binaries + GitHub Release.

on:
  push:
    branches: [main]
    # Tag pushes go through the same test gate before the image jobs build them:
    # the `images` job (all four → :develop on main, :<tag> on a tag, both
    # registries) and the GoReleaser `release` job (binaries + GitHub Release).
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + handler tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tring
          POSTGRES_PASSWORD: tring_dev
          # DB name contains "test" — the dbtest harness refuses to run its
          # destructive TRUNCATE against any database without "test" in the
          # name, so a dev/prod DSN can never be wiped by accident.
          POSTGRES_DB: tring_test
        ports:
          - 5432:5432
        # Health check is what lets `go test` start the moment the DB is
        # actually accepting connections, rather than racing the daemon boot.
        options: >-
          --health-cmd "pg_isready -U tring -d tring_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Wait for Postgres
        env:
          PGPASSWORD: tring_dev
        run: |
          # Service health check covers the daemon; this loop covers the
          # extra few seconds it takes for the network path from this job
          # step to settle. Schema bootstrap happens inside dbtest.Setup
          # (which runs the embedded golang-migrate up against this DB),
          # so no `psql -f db/schema.sql` step is needed.
          for i in 1 2 3 4 5; do
            if pg_isready -h 127.0.0.1 -U tring -d tring_test; then break; fi
            sleep 2
          done

      - name: go vet
        run: go vet ./...

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json

      - name: Build widget bundles
        # The browser bundles are embedded by internal/widget and served at
        # /sdk/*. TestSDKWidgetServed needs them present at compile time, so
        # build them before `go test` (mirrors the Dockerfile's sdk stage).
        run: make sdk

      - name: go test
        env:
          # The dbtest harness reads this; unset == skip DB-dependent tests.
          # DB name must contain "test" (guard against truncating real data).
          TRING_TEST_DSN: postgres://tring:tring_dev@127.0.0.1:5432/tring_test
        # -p 1 serialises test-package execution. dbtest.Setup TRUNCATEs
        # shared tables + inserts a fixed-sip-domain tenant; running two
        # packages in parallel would have them race on the UNIQUE
        # constraint. Cheap to keep serial — total runtime is small.
        run: go test -race -p 1 -count=1 -timeout=90s ./...

      - name: go test (libopus mixer)
        # The gateway image links libopus so a supervisor's barge is mixed into
        # phone calls (internal/media/sfu/mix_opus.go, build tag `opus`).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopus-dev
          go test -race -count=1 -timeout=90s -tags "opus nolibopusfile" ./internal/media/sfu/

  integration:
    name: FreeSWITCH integration
    # Runs on main pushes, manual dispatch, and PRs from branches in this
    # same repo. PRs from forks are excluded — booting a multi-service
    # stack for untrusted code is both a CI-cost and a security concern
    # (the integration test step has access to repo secrets).
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # No `needs: unit`: the two test jobs run side by side to save wall-clock
    # time. `images` and `release` still need both.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      # Boot just the bits the FS integration test needs. Bringing up `api`
      # here too would force a rebuild of an image per CI run; we don't need
      # it for the ESL-level test.
      - name: Boot FreeSWITCH + Postgres
        run: |
          docker compose up -d freeswitch postgres
          # FreeSWITCH takes ~10s to load modules; the healthcheck is the
          # source of truth.
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' tring-fs 2>/dev/null || echo none)
            echo "tring-fs health: $state"
            if [ "$state" = "healthy" ]; then break; fi
            sleep 2
          done
          docker compose ps

      # The base image gives each new container a random default_password
      # (12 chars that may include '-'). FreeSWITCH expands $${vars} even in
      # comments, so a value with "--" there breaks the XML and FS won't start
      # (~1 container in 370). Boot this PR's image with a worst-case password
      # seeded, so any config that would break on it fails here, not on deploy.
      - name: FreeSWITCH config survives a worst-case password
        run: |
          docker build -q -t tring-fs-pwcheck ./freeswitch
          docker run -d --name fs-pwcheck --entrypoint sh tring-fs-pwcheck -c '
            mkdir -p /etc/freeswitch &&
            cp -arf /usr/share/freeswitch/conf/vanilla/* /etc/freeswitch/ &&
            sed -i "s/default_password=[^\"]*/default_password=-a--b--c--d-/" /etc/freeswitch/vars.xml &&
            exec /entrypoint.sh'
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' fs-pwcheck 2>/dev/null || echo none)
            if [ "$state" = "healthy" ]; then echo "FreeSWITCH is up"; docker rm -f fs-pwcheck; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' fs-pwcheck)" != "true" ]; then break; fi
            sleep 2
          done
          echo "FreeSWITCH did not start with default_password=-a--b--c--d-:"
          docker logs fs-pwcheck 2>&1 | grep -E "Cannot Initialize|error near" || docker logs fs-pwcheck 2>&1 | tail -50
          exit 1

      - name: Run integration tests
        env:
          TRING_INTEGRATION_FS_ADDR: 127.0.0.1:8021
          TRING_INTEGRATION_FS_PASSWORD: ClueCon
        run: go test -tags=integration -count=1 -timeout=120s -v ./internal/freeswitch/...

      - name: Dump FS logs on failure
        if: failure()
        run: docker compose logs freeswitch | tail -200

  # ─── Publish phase ────────────────────────────────────────────────
  # Two mutually-exclusive jobs handle publishing, both gated on the
  # tests passing first:
  #   - build-develop: main-branch pushes → :develop tag, multi-arch
  #   - release:       v* tag pushes      → GoReleaser (binaries +
  #                                          release notes + version-
  #                                          tagged multi-arch images)

  # ONE job builds & pushes three images on BOTH triggers, gated on the tests
  # above:
  #   push to main   -> :develop
  #   push a v* tag  -> :<tag>   (the tag name verbatim, e.g. v0.1.0)
  # to GHCR + Docker Hub. The two Go binaries share the root Dockerfile
  # (--build-arg CMD); freeswitch is its own image (amd64 only — its base
  # safarov/freeswitch has no arm64). GoReleaser (the `release` job) no longer
  # builds images — only binaries + the GitHub Release.
  images:
    name: image · ${{ matrix.name }}
    needs: [unit, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api,        context: ".",          file: Dockerfile,             args: "CMD=api",    platforms: "linux/amd64,linux/arm64" }
          - { name: gateway,    context: ".",          file: Dockerfile,             args: "CMD=gateway", platforms: "linux/amd64,linux/arm64" }
          - { name: freeswitch, context: "freeswitch", file: "freeswitch/Dockerfile", args: "",          platforms: "linux/amd64" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag on a release, develop-<short sha> on main; read by the api's
      # console footer (Dockerfile ARG VERSION → main.version).
      - name: Build version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME}"; else v="develop-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/tring-${{ matrix.name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tring-${{ matrix.name }}
          tags: |
            type=raw,value=develop,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            ${{ matrix.args }}
            VERSION=${{ steps.version.outputs.version }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tring-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=tring-${{ matrix.name }}

  release:
    name: Release (GoReleaser + version-tagged images)
    needs: [unit, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GoReleaser creates the GitHub Release + uploads binaries
      packages: write   # for ghcr.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so GoReleaser can build the changelog

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_ORG: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_ORG: ${{ github.repository_owner }}
