name: Build develop images

# Main-only workflow. Tags are handled by .github/workflows/release.yml
# (GoReleaser). Both binaries get published to GHCR + Docker Hub with
# the `:develop` tag on every push to main.

on:
  push:
    branches:
      - main

concurrency:
  group: build-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        binary: [api, orchestrator]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push develop image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            CMD=${{ matrix.binary }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tring-${{ matrix.binary }}:develop
            ghcr.io/${{ github.repository_owner }}/tring-${{ matrix.binary }}:develop
          cache-from: type=gha,scope=tring-${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=tring-${{ matrix.binary }}
