name: Build images

on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Cancel any in-flight build for the same ref when a newer push arrives.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # for ghcr.io push
    strategy:
      fail-fast: false
      matrix:
        binary: [api, orchestrator]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Tag rule:
      #   - push to main      → "develop"
      #   - push tag v0.2.0   → "v0.2.0"  (literal — the user wanted the tag name)
      - name: Determine image tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            CMD=${{ matrix.binary }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tring-${{ matrix.binary }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/tring-${{ matrix.binary }}:${{ steps.tag.outputs.tag }}
          # GHA cache, scoped per binary so the two matrix legs don't
          # invalidate each other's layers.
          cache-from: type=gha,scope=tring-${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=tring-${{ matrix.binary }}
