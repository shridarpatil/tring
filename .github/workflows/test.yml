name: Tests

# Two-stage test pipeline. The fast `unit` job runs on every push + PR and
# covers everything that doesn't need FreeSWITCH: pure-function tests, JWT,
# masking, webhook signing, plus DB-backed handler/trunks tests against a
# Postgres service container. The slower `integration` job boots the full
# docker-compose stack and runs the FreeSWITCH-tagged tests against a real
# ESL endpoint. PRs don't get the integration job (gating on FS boot would
# wedge unrelated PRs); it runs only on main + manual dispatch.

on:
  push:
    branches: [main]
    # Tag pushes go through the same test gate before release.yml's
    # responsibilities (GoReleaser binaries + version-tagged images)
    # kick off in the `release` job at the bottom of this file.
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + handler tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tring
          POSTGRES_PASSWORD: tring_dev
          # DB name contains "test" — the dbtest harness refuses to run its
          # destructive TRUNCATE against any database without "test" in the
          # name, so a dev/prod DSN can never be wiped by accident.
          POSTGRES_DB: tring_test
        ports:
          - 5432:5432
        # Health check is what lets `go test` start the moment the DB is
        # actually accepting connections, rather than racing the daemon boot.
        options: >-
          --health-cmd "pg_isready -U tring -d tring_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Wait for Postgres
        env:
          PGPASSWORD: tring_dev
        run: |
          # Service health check covers the daemon; this loop covers the
          # extra few seconds it takes for the network path from this job
          # step to settle. Schema bootstrap happens inside dbtest.Setup
          # (which runs the embedded golang-migrate up against this DB),
          # so no `psql -f db/schema.sql` step is needed.
          for i in 1 2 3 4 5; do
            if pg_isready -h 127.0.0.1 -U tring -d tring_test; then break; fi
            sleep 2
          done

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          # The dbtest harness reads this; unset == skip DB-dependent tests.
          # DB name must contain "test" (guard against truncating real data).
          TRING_TEST_DSN: postgres://tring:tring_dev@127.0.0.1:5432/tring_test
        run: go test -race -count=1 -timeout=60s ./...

  integration:
    name: FreeSWITCH integration
    # Runs on main pushes, manual dispatch, and PRs from branches in this
    # same repo. PRs from forks are excluded — booting a multi-service
    # stack for untrusted code is both a CI-cost and a security concern
    # (the integration test step has access to repo secrets).
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Boot just the bits the FS integration test needs. Bringing up `api`
      # and `orchestrator` here too would force a rebuild of two images per
      # CI run; we don't need them for the ESL-level test.
      - name: Boot FreeSWITCH + Postgres
        run: |
          docker compose up -d freeswitch postgres
          # FreeSWITCH takes ~10s to load modules; the healthcheck is the
          # source of truth.
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' tring-fs 2>/dev/null || echo none)
            echo "tring-fs health: $state"
            if [ "$state" = "healthy" ]; then break; fi
            sleep 2
          done
          docker compose ps

      - name: Run integration tests
        env:
          TRING_INTEGRATION_FS_ADDR: 127.0.0.1:8021
          TRING_INTEGRATION_FS_PASSWORD: ClueCon
        run: go test -tags=integration -count=1 -timeout=120s -v ./internal/freeswitch/...

      - name: Dump FS logs on failure
        if: failure()
        run: docker compose logs freeswitch | tail -200

  # ─── Publish phase ────────────────────────────────────────────────
  # Two mutually-exclusive jobs handle publishing, both gated on the
  # tests passing first:
  #   - build-develop: main-branch pushes → :develop tag, multi-arch
  #   - release:       v* tag pushes      → GoReleaser (binaries +
  #                                          release notes + version-
  #                                          tagged multi-arch images)

  build-develop:
    name: Build & push :develop
    needs: [unit, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        binary: [api, orchestrator]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push develop image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            CMD=${{ matrix.binary }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tring-${{ matrix.binary }}:develop
            ghcr.io/${{ github.repository_owner }}/tring-${{ matrix.binary }}:develop
          cache-from: type=gha,scope=tring-${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=tring-${{ matrix.binary }}

  release:
    name: Release (GoReleaser + version-tagged images)
    needs: [unit, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GoReleaser creates the GitHub Release + uploads binaries
      packages: write   # for ghcr.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so GoReleaser can build the changelog

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_ORG: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_ORG: ${{ github.repository_owner }}
